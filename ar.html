<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>太空梭 AR 掃描</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Share+Tech+Mono&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面概念：相機取景器 — 全螢幕畫面，上方步驟列、下方操作列，像平板相機 App */
:root{
  --bg:#070B14; --panel:rgba(12,18,32,.78); --ink:#EEF2FA; --muted:#9AA6BF; --line:rgba(255,255,255,.16);
  --accent:#FF8A3D; --accent-ink:#1A0E05; --guide:#7CF0C8; --warn:#FFB4A8;
  --f-display:"Orbitron","Share Tech Mono",ui-monospace,monospace;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"Share Tech Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0;overflow:hidden;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button,label.btn{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{position:relative;height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  padding:10px max(16px,env(safe-area-inset-left,0px)) 8px max(16px,env(safe-area-inset-right,0px));background:var(--bg);z-index:5}
.brand{display:flex;flex-direction:column;min-width:0}
.brand small{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.brand b{font-size:17px;line-height:1.25}
.steps{display:flex;gap:4px;list-style:none;margin:0;padding:0;font-size:12.5px}
.steps li{padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.steps li.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.steps li.done{color:var(--ink)}
.stage{position:relative;flex:1;min-height:0;background:#000;overflow:hidden;touch-action:none}
.stage>video,.stage>canvas,.stage>svg,.stage>img{position:absolute;inset:0;width:100%;height:100%}
.stage>video,.stage>canvas.frame{object-fit:contain}
#bgimg{object-fit:cover;filter:blur(14px) brightness(.55);transform:scale(1.08)}
.hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--panel);backdrop-filter:blur(6px);
  border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:14px;text-align:center;max-width:calc(100% - 24px);z-index:3}
.hint b{color:var(--guide)}
.bar{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
  padding:12px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));background:var(--bg);z-index:5}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:999px;padding:10px 18px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:rgba(255,255,255,.12)}
.btn.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.go:hover{filter:brightness(1.07)}
.shutter{width:68px;height:68px;border-radius:50%;border:4px solid #fff;background:var(--accent);cursor:pointer;padding:0}
.shutter:active{transform:scale(.95)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.samples{position:absolute;inset:0;background:rgba(5,8,15,.92);z-index:6;display:flex;flex-direction:column;gap:12px;
  padding:16px max(16px,env(safe-area-inset-left,0px)) 16px max(16px,env(safe-area-inset-right,0px));overflow:auto}
.samples h2{margin:0;font-size:18px}
.samples p{margin:0;color:var(--muted);font-size:14px;max-width:62ch}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sgrid button{border:1px solid var(--line);background:#0E1526;border-radius:10px;padding:0;overflow:hidden;cursor:pointer;text-align:left}
.sgrid img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.sgrid span{display:block;padding:6px 8px;font-size:13px}
.tele{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 16px;text-align:center;z-index:3;pointer-events:none}
.tele .clock{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.05em;font-variant-numeric:tabular-nums}
.tele .ev{font-size:13.5px;color:var(--muted)}
.swatch{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;border:1px solid var(--line)}
.handle{cursor:grab}
.note{position:absolute;left:12px;bottom:12px;right:12px;font-size:12.5px;color:var(--muted);text-align:center;z-index:3;pointer-events:none}
@media (prefers-reduced-motion:reduce){.shutter:active{transform:none}}
</style>
</head>
<body>


<div class="app">
  <div class="top">
    <div class="brand"><small>學思創客 XUESI MAKER · AR</small><b>太空梭 AR 掃描</b></div>
    <ol class="steps" aria-label="步驟">
      <li id="st1" class="on">1 拍照</li><li id="st2">2 對齊</li><li id="st3">3 AR 發射</li>
    </ol>
  </div>

  <!-- 步驟 1：取景 -->
  <section class="stage" id="s1" aria-label="拍照取景">
    <video id="video" playsinline muted autoplay></video>
    <svg id="guide1" aria-hidden="true"></svg>
    <div class="hint" id="hint1">從<b>有雕刻的正面</b>拍你的太空梭，讓它對齊綠色框線，再按快門</div>
    <div class="samples" id="nocam" hidden>
      <h2>這台裝置不能開相機</h2>
      <p id="nocam-why">可以改用「上傳照片」，或先用下面的範例照片試試看：每一張都是不同的彩繪配色。</p>
      <div class="sgrid" id="sgrid1"></div>
    </div>
  </section>

  <!-- 步驟 2：對齊 -->
  <section class="stage" id="s2" aria-label="對齊" hidden>
    <canvas class="frame" id="frozen"></canvas>
    <svg id="guide2"></svg>
    <div class="hint">拖曳四個<b>綠點</b>到太空梭的機頭、左右翼尖、機尾中央，框線貼合後按「完成」</div>
  </section>

  <!-- 步驟 3：AR -->
  <section class="stage" id="s3" aria-label="AR 發射" hidden>
    <img id="bgimg" alt="">
    <video id="video3" playsinline muted autoplay hidden></video>
    <canvas id="gl"></canvas>
    <div class="tele" id="tele" hidden><div class="clock" id="clock">T−10</div><div class="ev" id="ev"></div></div>
    <div class="note" id="note3">拖曳旋轉、雙指縮放。機身顏色 <span class="swatch" id="sw"></span> 取自你的彩繪</div>
  </section>

  <div class="bar" id="bar1">
    <label class="btn" for="file">上傳照片</label>
    <input class="sr" id="file" type="file" accept="image/*">
    <button class="shutter" id="shoot" aria-label="拍照"></button>
    <button class="btn" id="b-samples">範例照片</button>
  </div>
  <div class="bar" id="bar2" hidden>
    <button class="btn" id="b-retake">重拍</button>
    <button class="btn go" id="b-done">完成，產生 3D</button>
  </div>
  <div class="bar" id="bar3" hidden>
    <button class="btn" id="b-rescan">重新掃描</button>
    <button class="btn" id="b-cam">相機背景</button>
    <button class="btn go" id="b-launch">發射</button>
  </div>
</div>

  if(n===3) resize3();
}

/* ---------------- 步驟 1：相機與導引框 ---------------- */
let stream = null, frameW = 1280, frameH = 960;
function defaultHandles(w, h){
  const s = 0.66*h / (AR.handles.nose[1]-AR.handles.tail[1]);
  const pos = {}; for(const k of HK){ const [u,v]=AR.handles[k]; pos[k] = [w/2 + s*u, h*0.15 + s*(AR.handles.nose[1]-v)]; }
  return pos;
}
function outlineD(map){ return P.outline.map((q,i)=>{ const [x,y]=map(q[0],q[1]); return (i?'L':'M')+x.toFixed(1)+','+y.toFixed(1); }).join('')+'Z'; }
function drawGuide(svg, w, h, H, handles){
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`); svg.setAttribute('preserveAspectRatio','xMidYMid meet'); svg.innerHTML='';
  const path = document.createElementNS(SVGNS,'path');
  path.setAttribute('d', outlineD((u,v)=>applyH(H,u,v)));
  const sw = Math.max(2, w/420);
  path.setAttribute('fill','rgba(124,240,200,.08)'); path.setAttribute('stroke','#7CF0C8'); path.setAttribute('stroke-width',sw);
  path.setAttribute('stroke-dasharray', `${sw*4} ${sw*3}`); path.id = svg.id+'-path'; svg.appendChild(path);
  if(!handles) return;
  for(const k of HK){
    const g = document.createElementNS(SVGNS,'g'); g.classList.add('handle'); g.dataset.k = k; g.setAttribute('tabindex','0');
    g.setAttribute('role','slider'); g.setAttribute('aria-label', HLABEL[k]+'位置（方向鍵微調）');
    const r = Math.max(14, w/55);
    g.innerHTML = `<circle r="${r*2.2}" fill="transparent"/><circle r="${r}" fill="rgba(124,240,200,.25)" stroke="#7CF0C8" stroke-width="${sw*1.2}"/><circle r="${sw*1.6}" fill="#7CF0C8"/>
      <text y="${-r*1.5}" text-anchor="middle" fill="#fff" stroke="rgba(0,0,0,.6)" stroke-width="${sw*1.6}" paint-order="stroke" font-size="${r*1.05}" font-family="Noto Sans TC, sans-serif">${HLABEL[k]}</text>`;
    g.setAttribute('transform', `translate(${handles[k][0]},${handles[k][1]})`);
    svg.appendChild(g);
  }
}
const srcPts = HK.map(k=>AR.handles[k]);
async function startCamera(){
  const why = $('nocam-why');
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ showNoCam('這個瀏覽器不支援相機，或網頁不是用 https 開啟。'); return; }
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1440}}, audio:false});
    const v = $('video'); v.srcObject = stream; await v.play();
    const fit = ()=>{ frameW = v.videoWidth || 1280; frameH = v.videoHeight || 960;
      const hd = defaultHandles(frameW, frameH); drawGuide($('guide1'), frameW, frameH, solveH(srcPts, HK.map(k=>hd[k])), null); };
    if(v.videoWidth) fit(); else v.addEventListener('loadedmetadata', fit, {once:true});
  }catch(e){ showNoCam('相機沒有開啟（可能被拒絕權限或被其他程式使用）。'); }
}
function showNoCam(msg){ $('nocam-why').textContent = msg + ' 可以改用「上傳照片」，或先用下面的範例照片試試看：每一張都是不同的彩繪配色。'; $('nocam').hidden = false; $('shoot').hidden = true; }
function fillSamples(el){
  el.innerHTML = SAMPLES.map((s,i)=>`<button type="button" data-i="${i}"><img src="${s.src}" alt="${s.name}" loading="lazy"><span>${s.name}</span></button>`).join('');
  el.onclick = e=>{ const b=e.target.closest('button[data-i]'); if(!b) return; const s=SAMPLES[+b.dataset.i]; loadImage(s.src, s.handles); };
}
fillSamples($('sgrid1'));
$('b-samples').onclick = ()=>{ $('nocam').hidden = false; if(stream) $('nocam').querySelector('h2').textContent='範例照片'; };
$('shoot').onclick = ()=>{
  const v = $('video'); if(!v.videoWidth) return;
  const c = $('frozen'); c.width = v.videoWidth; c.height = v.videoHeight; c.getContext('2d').drawImage(v,0,0);
  enterAlign(defaultHandles(c.width, c.height));
};
$('file').onchange = e=>{ const f = e.target.files[0]; if(!f) return; const url = URL.createObjectURL(f); loadImage(url, null); e.target.value=''; };
function loadImage(src, preset){
  const img = new Image();
  img.onload = ()=>{
    const maxW = 2000, sc = Math.min(1, maxW/Math.max(img.naturalWidth, img.naturalHeight));
    const c = $('frozen'); c.width = Math.round(img.naturalWidth*sc); c.height = Math.round(img.naturalHeight*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const hd = preset ? Object.fromEntries(HK.map(k=>[k,[preset[k][0]*c.width, preset[k][1]*c.height]])) : defaultHandles(c.width, c.height);
    enterAlign(hd);
  };
  img.src = src;
}

/* ---------------- 步驟 2：四點對齊 ---------------- */
let handles = null;
function enterAlign(hd){
  handles = hd; $('nocam').hidden = true; go(2);
  const c = $('frozen'); redrawAlign();
}
function redrawAlign(){
  const c = $('frozen'); drawGuide($('guide2'), c.width, c.height, solveH(srcPts, HK.map(k=>handles[k])), handles);
}
(function dragHandles(){
  const svg = $('guide2'); let drag = null;
  const toSvg = e=>{ const pt = svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY; const m = svg.getScreenCTM().inverse(); const p = pt.matrixTransform(m); return [p.x,p.y]; };
  svg.addEventListener('pointerdown', e=>{ const g = e.target.closest('.handle'); if(!g) return; drag = {k:g.dataset.k, id:e.pointerId}; svg.setPointerCapture(e.pointerId); e.preventDefault(); });
  svg.addEventListener('pointermove', e=>{ if(!drag || e.pointerId!==drag.id) return; handles[drag.k] = toSvg(e); updateDrag(drag.k); });
  const end = e=>{ if(drag && e.pointerId===drag.id) drag=null; };
  svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);
  svg.addEventListener('keydown', e=>{ const g = e.target.closest('.handle'); if(!g) return; const k=g.dataset.k, st=e.shiftKey?10:2;
    const d={ArrowLeft:[-st,0],ArrowRight:[st,0],ArrowUp:[0,-st],ArrowDown:[0,st]}[e.key]; if(!d) return; e.preventDefault();
    handles[k]=[handles[k][0]+d[0], handles[k][1]+d[1]]; updateDrag(k); });
  function updateDrag(k){
    const H = solveH(srcPts, HK.map(q=>handles[q]));
    $('guide2-path').setAttribute('d', outlineD((u,v)=>applyH(H,u,v)));
    const g = svg.querySelector(`.handle[data-k="${k}"]`); g.setAttribute('transform', `translate(${handles[k][0]},${handles[k][1]})`);
  }
})();
$('b-retake').onclick = ()=>{ go(1); };

/* ---------------- 取出彩繪貼圖 ---------------- */
function extractTexture(){
  const c = $('frozen'), sw = c.width, sh = c.height;
  const src = c.getContext('2d').getImageData(0,0,sw,sh).data;
  const H = solveH(srcPts, HK.map(k=>handles[k]));
  const k = 5, [x0,y0,x1,y1] = P.bbox, w = Math.ceil((x1-x0)*k), h = Math.ceil((y1-y0)*k);
  const out = document.createElement('canvas'); out.width=w; out.height=h; const og = out.getContext('2d');
  // 遮罩：只取主板輪廓內
  og.fillStyle='#000'; og.fill(ringsPath([P.outline], u=>(u-x0)*k, v=>(y1-v)*k));
  const mask = og.getImageData(0,0,w,h).data;
  const im = og.createImageData(w,h), d = im.data;
  const lum = [];
  for(let j=0;j<h;j++){ const v = y1 - (j+.5)/k;
    for(let i=0;i<w;i++){ const o=(j*w+i)*4; if(mask[o+3]<128) continue;
      const u = x0 + (i+.5)/k; let [X,Y] = applyH(H,u,v);
      X = Math.min(sw-1.001, Math.max(0,X)); Y = Math.min(sh-1.001, Math.max(0,Y));
      const xi=X|0, yi=Y|0, fx=X-xi, fy=Y-yi, a=(yi*sw+xi)*4, b=a+4, cc=a+sw*4, dd=cc+4;
      for(let ch=0;ch<3;ch++){ d[o+ch] = (src[a+ch]*(1-fx)+src[b+ch]*fx)*(1-fy) + (src[cc+ch]*(1-fx)+src[dd+ch]*fx)*fy; }
      d[o+3]=255; lum.push(.299*d[o]+.587*d[o+1]+.114*d[o+2]);
    } }
  // 自動亮度：拉開明暗（保留 60% 原色，避免顏色失真）
  lum.sort((p,q)=>p-q); const lo = lum[Math.floor(lum.length*.02)]||0, hi = lum[Math.floor(lum.length*.985)]||255;
  const gain = 255/Math.max(40, hi-lo);
  for(let o=0;o<d.length;o+=4){ if(!d[o+3]) continue; for(let ch=0;ch<3;ch++){ const s=(d[o+ch]-lo)*gain; d[o+ch] = Math.max(0,Math.min(255, d[o+ch]*.4 + s*.6)); } }
  og.putImageData(im,0,0);
  // 機身主色（給機背尾翼上色）：機身兩側、避開中央尾翼與深色雕刻
  let sr=0,sg=0,sb=0,n=0;
  for(let j=0;j<h;j++){ const v=y1-(j+.5)/k; if(v<70||v>125) continue;
    for(let i=0;i<w;i++){ const u=x0+(i+.5)/k; if(Math.abs(u)<4||Math.abs(u)>10.5) continue; const o=(j*w+i)*4; if(!d[o+3]) continue;
      const L=.299*d[o]+.587*d[o+1]+.114*d[o+2]; if(L<45) continue; sr+=d[o]; sg+=d[o+1]; sb+=d[o+2]; n++; } }
  const body = n ? `rgb(${sr/n|0},${sg/n|0},${sb/n|0})` : '#D8B27C';
  return {canvas: out, body};
}
$('b-done').onclick = ()=>{
  const {canvas, body} = extractTexture();
  $('bgimg').src = $('frozen').toDataURL('image/jpeg', .7);
  $('sw').style.background = body;
  buildModel(canvas, body);
  go(3);
};

/* ---------------- 步驟 3：3D／AR ---------------- */
const gl = $('gl');
const renderer = new THREE.WebGLRenderer({canvas:gl, antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 1, 8000);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8c7c6a, .7));
const sun = new THREE.DirectionalLight(0xfff4e6, .9); sun.position.set(-220,420,320); sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024); Object.assign(sun.shadow.camera,{left:-200,right:200,top:260,bottom:-120,near:50,far:1500}); scene.add(sun);
const shadowFloor = new THREE.Mesh(new THREE.PlaneGeometry(900,900), new THREE.ShadowMaterial({opacity:.32}));
shadowFloor.rotation.x = -Math.PI/2; shadowFloor.position.y = -2*T-.05; shadowFloor.receiveShadow = true; scene.add(shadowFloor);
const lin = h => new THREE.Color(h).convertSRGBToLinear();
const world = new THREE.Group(); scene.add(world);          // 可旋轉縮放的整體
const ship = new THREE.Group(); world.add(ship);            // 會飛的部分（主板＋尾翼＋火焰）
const shipParts = new THREE.Group(); ship.add(shipParts);
const pad = new THREE.Group(); world.add(pad);

function shapeOf(p){ const s = new THREE.Shape(p.outline.map(q=>new THREE.Vector2(q[0],q[1]))); for(const h of p.holes) s.holes.push(new THREE.Path(h.map(q=>new THREE.Vector2(q[0],q[1])))); return s; }
function texOf(c, p){ const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; const [x0,y0,x1,y1]=p.bbox; t.repeat.set(1/(x1-x0),1/(y1-y0)); t.offset.set(-x0/(x1-x0),-y0/(y1-y0)); t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t; }
function plate(p, faceCanvas, basis, origin, parent, backColor='#D2AC74'){
  const shape = shapeOf(p);
  const m = new THREE.Mesh(new THREE.ExtrudeGeometry(shape,{depth:T,bevelEnabled:false,curveSegments:1}),
    [new THREE.MeshStandardMaterial({color:lin(backColor), roughness:.85}), new THREE.MeshStandardMaterial({color:lin('#5A391C'), roughness:.9})]);
  m.castShadow = m.receiveShadow = true;
  const ov = new THREE.Mesh(new THREE.ShapeGeometry(shape), new THREE.MeshStandardMaterial({map:texOf(faceCanvas,p), roughness:.8, polygonOffset:true, polygonOffsetFactor:-2}));
  ov.position.z = T+.02; ov.receiveShadow = true;
  const g = new THREE.Group(); g.add(m, ov);
  const [eu,ev] = basis.map(a=>new THREE.Vector3(...a)); const ew = new THREE.Vector3().crossVectors(eu,ev);
  g.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(eu,ev,ew)); g.position.set(...origin);
  parent.add(g); return g;
}
function clearGroup(g){ while(g.children.length){ const c=g.children.pop(); c.traverse(o=>{ if(o.geometry) o.geometry.dispose(); if(o.material){ [].concat(o.material).forEach(m=>{ if(m.map) m.map.dispose(); m.dispose(); }); } }); } }
function buildModel(faceCanvas, body){
  clearGroup(shipParts); clearGroup(pad);
  plate(P, faceCanvas, [[1,0,0],[0,1,0]], [0,0,0], shipParts);
  plate(D, engraveCanvas(D, body), [[0,0,1],[0,1,0]], [T/2,0,T], shipParts);
  plate(GT, engraveCanvas(GT, null), [[1,0,0],[0,0,-1]], [0,-T,0], pad);
  plate(GB, engraveCanvas(GB, null), [[1,0,0],[0,0,-1]], [0,-2*T,0], pad);
  resetLaunch();
}
/* 互動：拖曳旋轉、雙指縮放 */
const view = {yaw:-0.35, pitch:0.18, r:430};
(function(){ const s3 = $('s3'), pts = new Map(); let pinch = 0;
  s3.addEventListener('pointerdown', e=>{ s3.setPointerCapture(e.pointerId); pts.set(e.pointerId,[e.clientX,e.clientY]); });
  s3.addEventListener('pointermove', e=>{ if(!pts.has(e.pointerId)) return; const [px,py]=pts.get(e.pointerId); pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(pts.size===1){ view.yaw -= (e.clientX-px)*.008; view.pitch = Math.max(-.2, Math.min(1.2, view.pitch + (e.clientY-py)*.006)); }
    else if(pts.size===2){ const [a,b]=[...pts.values()]; const d=Math.hypot(a[0]-b[0],a[1]-b[1]); if(pinch) view.r = Math.max(180, Math.min(1400, view.r*pinch/d)); pinch=d; } });
  const end = e=>{ pts.delete(e.pointerId); if(pts.size<2) pinch=0; };
  s3.addEventListener('pointerup', end); s3.addEventListener('pointercancel', end);
  s3.addEventListener('wheel', e=>{ e.preventDefault(); view.r = Math.max(180, Math.min(1400, view.r*(1+Math.sign(e.deltaY)*.08))); }, {passive:false});
})();
function resize3(){ const s=$('s3'), w=s.clientWidth, h=s.clientHeight; if(!w||!h) return; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize3);

/* 相機背景（AR 合成） */
let camBg = false;
$('b-cam').onclick = async ()=>{
  const v3 = $('video3');
  if(camBg){ camBg=false; v3.hidden=true; $('bgimg').hidden=false; $('b-cam').textContent='相機背景'; return; }
  try{
    if(!stream) stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}, audio:false});
    v3.srcObject = stream; await v3.play(); v3.hidden=false; v3.style.objectFit='cover'; $('bgimg').hidden=true; camBg=true; $('b-cam').textContent='照片背景';
  }catch(e){ $('note3').textContent='這台裝置不能開相機，先用照片當背景。'; }
};
$('b-rescan').onclick = ()=>{ resetLaunch(); go(1); };

/* ---------------- 發射動畫（物件池） ---------------- */
function softTex(){ const c=document.createElement('canvas'); c.width=c.height=64; const g=c.getContext('2d'); const gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(.45,'rgba(255,255,255,.55)'); gr.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=gr; g.fillRect(0,0,64,64); return new THREE.CanvasTexture(c); }
const smokeTex = softTex(), smoke = [];
for(let i=0;i<160;i++){ const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:smokeTex, transparent:true, depthWrite:false, opacity:0})); sp.visible=false; world.add(sp); smoke.push({sp, alive:false, age:0, life:1, s0:1, s1:2, a:1, vel:new THREE.Vector3(), warm:0}); }
let si = 0;
function puff(p, v, s0, s1, life, a, warm){ const q=smoke[si]; si=(si+1)%smoke.length; Object.assign(q,{alive:true,age:0,life,s0,s1,a,warm}); q.sp.position.copy(p); q.vel.copy(v); q.sp.visible=true; q.sp.material.rotation=Math.random()*6.28; }
function flameGeo(r,h){ const g=new THREE.ConeGeometry(r,h,18,1,true); g.rotateX(Math.PI); g.translate(0,-h/2,0); return g; }   // 寬口在噴嘴、尖端朝下
function flame(pos){ const g=new THREE.Group();
  for(const [col,op,r,h] of [[0x9cc2ff,.4,4.6,48],[0xfff3dc,.85,2.3,20]]) g.add(new THREE.Mesh(flameGeo(r,h), new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide})));
  g.position.set(...pos); g.visible=false; ship.add(g); return g; }
const flames = [flame([6.2,0,1.5]), flame([-6.2,0,1.5]), flame([0,0,19])];   // 三具主發動機
const glow = new THREE.PointLight(0xffa860, 0, 600, 1.6); world.add(glow);
const L = {on:false, s:0, y:0, v:0, roll:0};
function resetLaunch(){ L.on=false; L.s=0; ship.position.set(0,0,0); ship.rotation.set(0,0,0); flames.forEach(f=>f.visible=false); glow.intensity=0;
  smoke.forEach(q=>{q.alive=false; q.sp.visible=false;}); $('tele').hidden=true; $('b-launch').textContent='發射'; }
$('b-launch').onclick = ()=>{ if(L.on){ resetLaunch(); return; } resetLaunch(); L.on=true; $('tele').hidden=false; $('b-launch').textContent='停止'; };
const EVS = [[0,'倒數計時'],[1.2,'主發動機點火'],[3,'升空！'],[4.2,'滾轉程序'],[7.2,'飛出大氣層…'],[9.5,'滑翔返航'],[12.6,'安全降落']];
function launchTick(dt){
  // 煙霧
  for(const q of smoke){ if(!q.alive) continue; q.age+=dt; if(q.age>=q.life){ q.alive=false; q.sp.visible=false; continue; }
    const k=q.age/q.life; q.sp.position.addScaledVector(q.vel,dt); q.vel.multiplyScalar(Math.max(0,1-.7*dt));
    const s=q.s0+(q.s1-q.s0)*Math.pow(k,.55); q.sp.scale.set(s,s,s); q.sp.material.opacity=q.a*Math.pow(1-k,1.4)*Math.min(1,q.age*8);
    const w=Math.max(0,q.warm*(1-k*4)); q.sp.material.color.setRGB(.86+.14*w,.84-.2*w,.82-.5*w); }
  if(!L.on) return;
  const s = (L.s += dt);
  let ev = ''; for(const e of EVS) if(s>=e[0]) ev=e[1]; $('ev').textContent = ev;
  $('clock').textContent = s<3 ? `T−${Math.ceil(3-s)}` : `T+${Math.floor(s-3)}`;
  const thrust = s>=1.2 && s<9.5;
  flames.forEach((f,i)=>{ f.visible = thrust && s>=1.2+i*.12; if(f.visible){ const fl=1+(Math.random()-.5)*.25, lv=Math.min(1,(s-1.2)/.6); f.scale.set(1,lv*fl,1); } });
  glow.intensity = thrust ? (1.2+Math.random()*.4)*(s<6?1:Math.max(0,1-(s-6)/2)) : 0;
  glow.position.set(ship.position.x, ship.position.y-10, 20);
  if(s>=3 && s<9.5){ const t=s-3; ship.position.y = 18*t*t + 6*t*t*t; ship.rotation.y = Math.min(Math.PI*2, t*1.4)*(t<4.5?1:1); ship.rotation.z = -Math.min(.35, Math.max(0,(t-1.2)*.12)); }
  if(s>=9.5){ // 從上方滑翔回到底座
    const t = Math.min(1, (s-9.5)/3.5), e = 1-Math.pow(1-t,3);
    ship.position.y = 900*(1-e); ship.rotation.y = 0; ship.rotation.z = -.35*(1-e); ship.position.x = 140*(1-e);
    if(t>=1){ resetLaunch(); }
  }
  // 點火後的煙
  if(thrust && s<6.5 && Math.random()<dt*40){ const a=Math.random()*6.283, sp=90+Math.random()*130;
    puff(new THREE.Vector3(Math.cos(a)*10, 2, 20+Math.sin(a)*8), new THREE.Vector3(Math.cos(a)*sp, 10+Math.random()*25, Math.sin(a)*sp*.6), 14, 80+Math.random()*30, 3.2, .75, s<3?.4:.15); }
  if(thrust && s>=3 && Math.random()<dt*28){ const p = new THREE.Vector3(ship.position.x+(Math.random()-.5)*8, ship.position.y-30-Math.random()*20, 20);
    puff(p, new THREE.Vector3((Math.random()-.5)*14,-20,(Math.random()-.5)*14), 10, 55, 2.6, .7, .9); }
}

/* ---------------- 主迴圈 ---------------- */
const clock = new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  let dt = clock.getDelta(); if(dt>.1) dt=.1;
  if(step!==3) return;
  launchTick(dt);
  const target = new THREE.Vector3(0, L.on ? Math.min(ship.position.y*.8, 700)+85 : 85, T);   // 鏡頭跟著往上看
  const cp = Math.cos(view.pitch);
  camera.position.set(target.x + view.r*Math.sin(view.yaw)*cp, target.y + view.r*Math.sin(view.pitch), target.z + view.r*Math.cos(view.yaw)*cp);
  camera.lookAt(target);
  renderer.render(scene, camera);
}
loop();
go(1);
if(location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1') startCamera();
else showNoCam('相機只能在 https 網址使用。');
</script>
